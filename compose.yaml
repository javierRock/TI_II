services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: prestamos_local_admin
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:?Configurar .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${PG_LOCAL_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos_local_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
