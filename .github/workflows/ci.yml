name: Verificación de TI_II
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ti-ii-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_temporal_postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ADMIN_DATABASE_URL: postgresql://postgres:ci_temporal_postgres@127.0.0.1:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://ti_ii_owner:ci_temporal_owner@127.0.0.1:5432/prestamos
      DATABASE_URL: postgresql://ti_ii_api:ci_temporal_api@127.0.0.1:5432/prestamos
      TEST_MIGRATION_DATABASE_URL: postgresql://ti_ii_owner:ci_temporal_owner@127.0.0.1:5432/prestamos_test
      TEST_DATABASE_URL: postgresql://ti_ii_api:ci_temporal_api@127.0.0.1:5432/prestamos_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:provision
      - run: npm run verify
